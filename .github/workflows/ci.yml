name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ENV: development
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements/*.txt
      - run: pip install -r requirements/dev.txt pip-audit
      - name: Tests
        working-directory: server/src
        run: python -m pytest -q
      - name: Migrations are up to date
        working-directory: server/src
        run: python manage.py makemigrations --check --dry-run
      - name: Production settings load
        working-directory: server/src
        env:
          DJANGO_ENV: production
          DJANGO_ALLOWED_HOSTS: studentassist.example.com
          DB_NAME: x
          DB_USER: x
          DB_PASSWORD: x
        run: python manage.py check --deploy --fail-level ERROR
      - name: Dependency audit
        # chromadb 1.0.20 advisories have no fixed release and concern its HTTP
        # server mode, which this app never runs (see docs/DEPLOYMENT.md).
        run: pip-audit -r requirements/base.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
